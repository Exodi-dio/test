name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build release
        env:
          KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
          SIGNING_STORE_FILE: ${{ github.workspace }}/signing/release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          mkdir -p signing
          echo "$KEYSTORE" | base64 -d > signing/release.jks
          gradle assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: now-playing-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
          body: |
            Now Playing, rebuilt on the Figma design.

            - Artwork backdrop with a real Compose blur that fades into a wash of the cover colours
            - Lyrics view with word level karaoke and per line blur
            - Queue view with the options card from the design, every option wired up
            - Scans the device on launch and starts playing

            Design: https://www.figma.com/design/KpKE1p45nLdf1ahrCzgXDh
